<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- App Icon Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border ring -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" />
  
  <!-- Decorative Chinese Cloud Motif Background Pattern -->
  <circle cx="120" cy="110" r="45" fill="#ffffff" fill-opacity="0.08" />
  <circle cx="390" cy="400" r="65" fill="#ffffff" fill-opacity="0.08" />
  
  <!-- Central Character '汉' (Han - Chinese) -->
  <text 
    x="50%" 
    y="56%" 
    text-anchor="middle" 
    dominant-baseline="central" 
    font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'STHeiti', sans-serif" 
    font-size="280" 
    font-weight="900" 
    fill="#ffffff" 
    filter="url(#shadow)"
  >汉</text>
  
  <!-- Small subtitle tag 'FR' in modern pill -->
  <rect x="176" y="420" width="160" height="42" rx="21" fill="#ffffff" fill-opacity="0.9" />
  <text 
    x="256" 
    y="442" 
    text-anchor="middle" 
    dominant-baseline="central" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="20" 
    font-weight="800" 
    letter-spacing="3" 
    fill="#dc2626"
  >FRASEIRO</text>
</svg>
